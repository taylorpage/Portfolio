<section id="projects" class="section projects">
  <div class="container">
    <div class="section-head" appReveal>
      <span class="section-index">03</span>
      <h2>Projects</h2>
      <span class="section-rule"></span>
    </div>

    <div class="projects-grid">
      @for (project of projects; track project.title) {
        <article class="project-card glass" [class.featured]="project.featured" appReveal>
          @if (project.featured) {
            <span class="featured-badge">Featured</span>
          }

          <div class="project-top">
            <div class="project-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                <path d="M8 4 3 12l5 8M16 4l5 8-5 8M14 3l-4 18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <div class="project-links">
              @if (project.liveUrl) {
                <a [href]="project.liveUrl" target="_blank" rel="noopener noreferrer" aria-label="Live demo">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
                    <path d="M14 4h6v6M20 4 10 14M6 4H4v16h16v-2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </a>
              }
              <a [href]="project.repoUrl" target="_blank" rel="noopener noreferrer" aria-label="Source code">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 .5C5.65.5.5 5.66.5 12.03c0 5.1 3.29 9.42 7.86 10.95.58.1.79-.25.79-.56 0-.28-.01-1.02-.02-2-3.2.7-3.88-1.54-3.88-1.54-.52-1.33-1.28-1.69-1.28-1.69-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.7 0-1.26.45-2.29 1.18-3.1-.12-.29-.51-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.79 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.24 2.76.12 3.05.74.81 1.18 1.84 1.18 3.1 0 4.43-2.7 5.4-5.27 5.69.42.36.78 1.08.78 2.18 0 1.57-.02 2.84-.02 3.23 0 .31.21.67.8.55A10.53 10.53 0 0 0 23.5 12.03C23.5 5.66 18.35.5 12 .5Z"/>
                </svg>
              </a>
            </div>
          </div>

          <h3>{{ project.title }}</h3>
          <p>{{ project.description }}</p>

          <ul class="project-tags">
            @for (tag of project.tags; track tag) {
              <li class="chip">{{ tag }}</li>
            }
          </ul>
        </article>
      }
    </div>
  </div>
</section>
