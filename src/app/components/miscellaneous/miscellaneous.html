<section id="miscellaneous" class="section miscellaneous">
  <div class="container">
    <div class="section-head" appReveal>
      <span class="section-index">05</span>
      <h2>Miscellaneous</h2>
    </div>

    <div class="misc-list">
      @for (item of items; track item.title) {
        <article class="misc-row" appReveal>
          <div>
            <h3>{{ item.title }}</h3>
            <p>{{ item.description }}</p>
          </div>

          @if (item.tags) {
            <ul class="misc-tags">
              @for (tag of item.tags; track tag) {
                <li>{{ tag }}</li>
              }
            </ul>
          }
        </article>
      }
    </div>
  </div>
</section>
